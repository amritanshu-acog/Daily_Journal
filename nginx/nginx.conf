# nginx/nginx.conf
# Reverse proxy for journal.aganitha.ai
# The Next.js app is NEVER exposed to the host — nginx talks to it via
# the internal Docker network on app:3000.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml image/svg+xml;

    # ── Upstream: Next.js app inside Docker network ──────────────────────────
    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    # ── HTTP — reverse proxy to Next.js ───────────────────────────────────────
    server {
        listen 80;
        server_name journal.aganitha.ai;

        location / {
            proxy_pass         http://nextjs_app;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_buffering       off;
            proxy_buffer_size     4k;
        }
    }
}
