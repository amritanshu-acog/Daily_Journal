# nginx/nginx.conf
# Reverse proxy for journal.aganitha.ai
# The Next.js app is NEVER exposed to the host — nginx talks to it via
# the internal Docker network on app:3000.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml image/svg+xml;

    # ── Upstream: Next.js app inside Docker network ──────────────────────────
    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name journal.aganitha.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — main site ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name journal.aganitha.ai;

        # ── SSL certificates (mount your wildcard / domain certs here) ────────
        # Place certs at /etc/ssl/aganitha/ on the host; mounted in compose.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                            ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           SAMEORIGIN                            always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── Static assets — served directly by nginx for speed ────────────────
        location /_next/static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Public folder (favicon, svgs, etc.) ──────────────────────────────
        location /public/ {
            alias /app/public/;
            expires 7d;
            access_log off;
        }

        # ── Proxy everything else to Next.js ─────────────────────────────────
        location / {
            proxy_pass         http://nextjs_app;
            proxy_http_version 1.1;

            # Required for Next.js streaming / server-sent events
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;

            # Buffer settings for Next.js streaming responses
            proxy_buffering    off;
            proxy_buffer_size  4k;
        }
    }
}
